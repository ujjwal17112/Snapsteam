{% extends "base.html" %}
{% block content %}

<div class="stats">
    <div class="card">
        <h4>Total Uploads</h4>
        <p>{{ total_videos }}</p>
    </div>
    <div class="card">
        <h4>Total Views</h4>
        <p>{{ total_views }}</p>
    </div>
    <div class="card">
        <h4>Plan</h4>
        <p>PRO</p>
    </div>
</div>


<!-- ⭐ VIDEO LIST SECTION (Added Only This Part) -->
<h3 style="margin-top:30px;">Uploaded Videos</h3>

<div class="video-grid">

{% for id, v in videos.items() %}

    <div class="card">

    <!-- Thumbnail -->
    <img 
        src="{{ url_for('static', filename='images/thumbnail.png') }}"
        style="width:100%; height:160px; object-fit:cover; border-radius:14px; margin-bottom:12px;"
    >

    <b>{{ v.title }}</b>
    <p>Views: {{ v.views }}</p>

    <a href="/stream/{{ id }}" class="btn">Watch</a>

</div>


{% else %}
    <p>No videos uploaded yet</p>
{% endfor %}

</div>

{% endblock %}
